<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>来店人数カウンター</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #fff5f8, #fce1ea);
      font-family: "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 90%;
      max-width: 1000px;
      text-align: center;
    }

    /* 上部：来店状況 */
    .status {
      background: rgba(255, 255, 255, 0.75);
      border-radius: 24px;
      padding: 24px;
      margin-bottom: 40px;
      box-shadow: 0 12px 30px rgba(248, 200, 216, 0.35);
    }

    .status-title {
      font-size: 28px;
      font-weight: 600;
      color: #b85c7a;
      margin-bottom: 10px;
    }

    .status-text {
      font-size: 36px;
      font-weight: 700;
      color: #333;
    }

    /* 下部：カウンター本体 */
    .wrapper {
      display: flex;
      justify-content: center;
      gap: 60px;
      background: rgba(255, 255, 255, 0.75);
      padding: 40px 60px;
      border-radius: 32px;
      box-shadow: 0 20px 40px rgba(248, 200, 216, 0.35);
    }

    .box {
      width: 320px;
      text-align: center;
    }

    .label {
      font-size: 40px;
      font-weight: 600;
      color: #b85c7a;
      margin-bottom: 10px;
    }

    .number {
      font-size: 150px;
      font-weight: 800;
      color: #333;
      margin-bottom: 20px;
    }

    .buttons {
      display: flex;
      justify-content: center;
      gap: 16px;
    }

    button {
      font-size: 26px;
      padding: 10px 26px;
      border: none;
      border-radius: 999px;
      background: #f4a9bf;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(244, 169, 191, 0.45);
      transition: all 0.2s ease;
    }

    button:hover {
      background: #ee8fad;
      transform: translateY(-2px);
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- 上部：来店状況 -->
    <div class="status">
      <div class="status-title">🌸 現在の来店状況</div>
      <div class="status-text">
        男性 <span id="menStatus">0</span>名 ／ 女性 <span id="womenStatus">0</span>名
      </div>
    </div>

    <!-- 下部：人数カウンター -->
    <div class="wrapper">

      <div class="box">
        <div class="label">男性</div>
        <div id="men" class="number">0</div>
        <div class="buttons">
          <button onclick="changeMen(1)">＋</button>
          <button onclick="changeMen(-1)">−</button>
        </div>
      </div>

      <div class="box">
        <div class="label">女性</div>
        <div id="women" class="number">0</div>
        <div class="buttons">
          <button onclick="changeWomen(1)">＋</button>
          <button onclick="changeWomen(-1)">−</button>
        </div>
      </div>

    </div>
  </div>

  <script>
    let men = 0;
    let women = 0;

    function changeMen(value) {
      men = Math.max(0, men + value);
      updateDisplay();
    }

    function changeWomen(value) {
      women = Math.max(0, women + value);
      updateDisplay();
    }

    function updateDisplay() {
      document.getElementById("men").textContent = men;
      document.getElementById("women").textContent = women;
      document.getElementById("menStatus").textContent = men;
      document.getElementById("womenStatus").textContent = women;
    }
  </script>

</body>
</html>
